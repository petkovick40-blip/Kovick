name: Kovick APK Final

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest" /tmp/cmdline
            mkdir -p /tmp/cmdline
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline
            mv /tmp/cmdline/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Build standalone Kovick
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9
          ./gradlew :app:assembleRelease --stacktrace
      - name: Sign APK
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore /tmp/kovick.keystore -storepass android -keypass android -alias kovick -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kovick,O=Kovick,C=BR" >/dev/null 2>&1
          zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Kovick-aligned.apk
          apksigner sign --ks /tmp/kovick.keystore --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/Kovick.apk app/build/outputs/apk/release/Kovick-aligned.apk
          apksigner verify --verbose app/build/outputs/apk/release/Kovick.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kovick-APK
          path: app/build/outputs/apk/release/Kovick.apk
          if-no-files-found: error
          retention-days: 90
