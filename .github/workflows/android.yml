name: Build Kovick APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and harden reconstructed Application
        run: |
          set -euo pipefail
          # The previous diagnostic commit accidentally replaced the full
          # reconstructed App.smali with a shortened version. Restore the
          # complete class from the last known-good source commit before build.
          git checkout f08b662c8d33444f7296787f8ec6835472d67ef2 -- smali/com/zjx/jyandroid/App.smali

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('smali/com/zjx/jyandroid/App.smali')
          s = p.read_text(encoding='utf-8')
          start = s.index('.method public onCreate()V')
          end = s.index('.end method', start) + len('.end method')

          replacement = '''.method public onCreate()V
              .registers 5

              sput-object p0, Lcom/zjx/jyandroid/App;->r6:Lcom/zjx/jyandroid/App;

              invoke-virtual {p0}, Landroid/content/Context;->getApplicationContext()Landroid/content/Context;
              move-result-object v0
              sput-object v0, Lcom/zjx/jyandroid/App;->s6:Landroid/content/Context;

              invoke-super {p0}, Landroid/app/Application;->onCreate()V

              :try_start_0
              invoke-static {v0}, LS8/d;->f(Landroid/content/Context;)V
              :try_end_5
              .catch Ljava/lang/Throwable; {:try_start_0 .. :try_end_5} :catch_5
              :catch_5

              :try_start_6
              invoke-virtual {p0}, Lcom/zjx/jyandroid/App;->E()V
              :try_end_b
              .catch Ljava/lang/Throwable; {:try_start_6 .. :try_end_b} :catch_b
              :catch_b

              :try_start_c
              invoke-virtual {p0, p0}, Landroid/app/Application;->registerActivityLifecycleCallbacks(Landroid/app/Application$ActivityLifecycleCallbacks;)V
              :try_end_11
              .catch Ljava/lang/Throwable; {:try_start_c .. :try_end_11} :catch_11
              :catch_11

              :try_start_12
              invoke-static {}, Landroidx/lifecycle/f0;->l()Landroidx/lifecycle/M;
              move-result-object v0
              invoke-interface {v0}, Landroidx/lifecycle/M;->getLifecycle()Landroidx/lifecycle/A;
              move-result-object v0
              invoke-virtual {v0, p0}, Landroidx/lifecycle/A;->c(Landroidx/lifecycle/L;)V
              :try_end_1f
              .catch Ljava/lang/Throwable; {:try_start_12 .. :try_end_1f} :catch_1f
              :catch_1f

              :try_start_20
              invoke-static {}, Lxf/c;->f()Lxf/c;
              move-result-object v0
              invoke-virtual {v0, p0}, Lxf/c;->v(Ljava/lang/Object;)V
              :try_end_2a
              .catch Ljava/lang/Throwable; {:try_start_20 .. :try_end_2a} :catch_2a
              :catch_2a

              return-void
          .end method'''

          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          print('Hardened App.onCreate while preserving the complete reconstructed class')
          PY
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android build tools
        run: sdkmanager "build-tools;36.0.0"
      - name: Install Apktool
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o "$RUNNER_TEMP/apktool.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "%s/apktool.jar" "$@"\n' "$RUNNER_TEMP" | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version
      - name: Prepare reconstructed Apktool project
        run: |
          set -euo pipefail
          test -f resources/AndroidManifest.xml
          test -d resources/res
          test -d smali
          rm -rf build-src
          mkdir -p build-src
          cp resources/AndroidManifest.xml build-src/AndroidManifest.xml
          cp -a resources/res build-src/res
          if [ -d resources/assets ]; then cp -a resources/assets build-src/assets; fi
          if [ -d resources/lib ]; then cp -a resources/lib build-src/lib; fi
          cp -a smali build-src/smali

          python3 <<'PY'
          from pathlib import Path
          import shutil
          root = Path('build-src/smali')
          files = sorted(root.rglob('*.smali'))
          LIMIT = 30000
          dex = 1
          methods = 0
          targets = {1: root}
          def method_count(p):
              return sum(1 for line in p.read_text(encoding='utf-8', errors='replace').splitlines() if line.startswith('.method '))
          for src in files:
              n = method_count(src)
              if methods and methods + n > LIMIT:
                  dex += 1
                  target = root.parent / f'smali_classes{dex}'
                  target.mkdir(parents=True, exist_ok=True)
                  targets[dex] = target
                  methods = 0
              else:
                  target = targets[dex]
              rel = src.relative_to(root)
              dst = target / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              if target != root:
                  shutil.move(str(src), str(dst))
              methods += n
          for d in sorted(root.rglob('*'), reverse=True):
              if d.is_dir() and not any(d.iterdir()):
                  d.rmdir()
          print(f'Split {len(files)} smali classes across {dex} dex source directories')
          PY

          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          res=Path('build-src/res')
          for p in res.rglob('*.9.png'):
              n=p.with_name(p.name[:-6]+'.png')
              if n.exists(): p.unlink()
              else: p.rename(n)
          for root in Path('build-src').glob('smali*'):
              for p in root.rglob('*.smali'):
                  lines=p.read_text(encoding='utf-8',errors='replace').splitlines(True)
                  idx=[i for i,x in enumerate(lines) if x.startswith('.class ')]
                  if len(idx)>1:
                      p.write_text(''.join(lines[:idx[1]]).rstrip()+'\n',encoding='utf-8')
          enum_maps = {
              'scaleType': {'0':'matrix','1':'fitXY','2':'fitStart','3':'fitCenter','4':'fitEnd','5':'center','6':'centerCrop','7':'centerInside'},
              'ellipsize': {'0':'none','1':'start','2':'middle','3':'end','4':'marquee'},
              'orientation': {'0':'horizontal','1':'vertical'},
              'layoutDirection': {'0':'ltr','1':'rtl','2':'inherit','3':'locale'},
              'textAlignment': {'0':'inherit','1':'gravity','2':'textStart','3':'textEnd','4':'center','5':'viewStart','6':'viewEnd'},
              'datePickerMode': {'1':'spinner','2':'calendar'},
              'visibility': {'0':'visible','1':'invisible','2':'gone'},
              'breakStrategy': {'0':'simple','1':'high_quality','2':'balanced'},
              'hyphenationFrequency': {'0':'none','1':'normal','2':'full','3':'fast','4':'normal'},
              'inputType': {'1':'text','2':'number','3':'phone','4':'datetime','7':'numberDecimal'},
              'windowSoftInputMode': {'0x10':'adjustResize','0x20':'adjustPan','0x11':'stateUnspecified|adjustResize'}
          }
          gravity = {'0x1':'center_horizontal','0x2':'left','0x3':'left','0x4':'right','0x5':'right','0x10':'center_vertical','0x11':'center','0x30':'top','0x50':'bottom','0x800003':'start','0x800005':'end','0x800013':'start|center_vertical','0x800033':'start|top','0x800053':'start|bottom','0x800055':'end|bottom'}
          def fix_style_file(p):
              s=p.read_text(encoding='utf-8',errors='replace')
              for attr,m in enum_maps.items():
                  for raw,name in m.items():
                      s=s.replace(f'<item name="android:{attr}">{raw}</item>', f'<item name="android:{attr}">{name}</item>')
              for attr in ('gravity','layout_gravity'):
                  for raw,name in gravity.items():
                      s=s.replace(f'<item name="android:{attr}">{raw}</item>', f'<item name="android:{attr}">{name}</item>')
              s=s.replace('<item name="android:layout_width">-1</item>','<item name="android:layout_width">match_parent</item>')
              s=s.replace('<item name="android:layout_width">-2</item>','<item name="android:layout_width">wrap_content</item>')
              s=s.replace('<item name="android:layout_height">-1</item>','<item name="android:layout_height">match_parent</item>')
              s=s.replace('<item name="android:layout_height">-2</item>','<item name="android:layout_height">wrap_content</item>')
              p.write_text(s,encoding='utf-8')
          for p in res.rglob('styles*.xml'): fix_style_file(p)
          for p in res.rglob('*.xml'):
              s=p.read_text(encoding='utf-8',errors='replace').replace('@attr/??','@null').replace('?attr/??','@null').replace('>???<','>Unknown<')
              p.write_text(s,encoding='utf-8')
          for p in res.rglob('*.xml'): ET.parse(p)
          PY

          python3 <<'PY'
          from pathlib import Path
          bad=[]
          for root in Path('build-src').glob('smali*'):
              for p in root.rglob('*.smali'):
                  n=p.read_text(encoding='utf-8',errors='replace').count('.class ')
                  if n!=1: bad.append((str(p),n))
          if bad:
              print(*bad[:20],sep='\n'); raise SystemExit(1)
          PY

          cat > build-src/apktool.yml <<'YAML'
          version: 3.0.3
          apkFileName: Kovick.apk
          isFrameworkApk: false
          usesFramework:
            ids:
              - 1
            tag: null
          sdkInfo:
            minSdkVersion: "27"
            targetSdkVersion: "35"
          packageInfo:
            forcedPackageId: 127
            renameManifestPackage: null
          versionInfo:
            versionCode: 406
            versionName: "2.3.21"
          resourcesInfo:
            packageId: 127
            packageName: com.zjx.ztezscreenshot
            sparseEntries: false
            compactEntries: false
            keepRawValues: false
          sharedLibrary: false
          sparseResources: false
          doNotCompress:
            - arsc
            - png
            - dex
          unknownFiles: {}
          YAML
      - name: Build unsigned APK
        run: |
          set -euo pipefail
          apktool b build-src -o "$RUNNER_TEMP/Kovick-unsigned.apk"
          test -s "$RUNNER_TEMP/Kovick-unsigned.apk"
      - name: Align and sign APK
        run: |
          set -euo pipefail
          B="$ANDROID_HOME/build-tools/36.0.0"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/kovick-debug.keystore" -storepass android -keypass android -alias kovick -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kovick, OU=Build, O=Kovick, L=Unknown, ST=Unknown, C=BR"
          "$B/zipalign" -f -p 4 "$RUNNER_TEMP/Kovick-unsigned.apk" "$RUNNER_TEMP/Kovick-aligned.apk"
          "$B/apksigner" sign --ks "$RUNNER_TEMP/kovick-debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/Kovick.apk" "$RUNNER_TEMP/Kovick-aligned.apk"
          "$B/apksigner" verify --verbose "$RUNNER_TEMP/Kovick.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kovick-APK
          path: ${{ runner.temp }}/Kovick.apk
          if-no-files-found: error
          retention-days: 14
          overwrite: true