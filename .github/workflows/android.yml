name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build workspace
        shell: bash
        run: |
          rm -rf build-src
          mkdir build-src
          shopt -s dotglob nullglob
          for item in *; do
            if [ "$item" != "build-src" ]; then cp -a "$item" build-src/; fi
          done
          echo "Workspace prepared"
