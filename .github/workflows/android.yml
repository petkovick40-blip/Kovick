name: Build Kovick APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android build tools
        run: sdkmanager "build-tools;36.0.0"
      - name: Install Apktool
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o "$RUNNER_TEMP/apktool.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "%s/apktool.jar" "$@"\n' "$RUNNER_TEMP" | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version
      - name: Prepare reconstructed Apktool project
        run: |
          set -euo pipefail
          test -f resources/AndroidManifest.xml
          test -d resources/res
          test -d smali
          rm -rf build-src
          mkdir -p build-src
          cp resources/AndroidManifest.xml build-src/AndroidManifest.xml
          cp -a resources/res build-src/res
          if [ -d resources/assets ]; then cp -a resources/assets build-src/assets; fi
          if [ -d resources/lib ]; then cp -a resources/lib build-src/lib; fi
          cp -a smali build-src/smali

          python3 <<'PY'
          from pathlib import Path
          res=Path('build-src/res')
          for p in res.rglob('*.9.png'):
              n=p.with_name(p.name[:-6]+'.png')
              if n.exists(): p.unlink()
              else: p.rename(n)
          root=Path('build-src/smali')
          for p in root.rglob('*.smali'):
              t=p.read_text(encoding='utf-8',errors='replace'); lines=t.splitlines(True)
              idx=[i for i,x in enumerate(lines) if x.startswith('.class ')]
              if len(idx)>1: p.write_text(''.join(lines[:idx[1]]).rstrip()+'\n',encoding='utf-8')
          values=Path('build-src/res/values')
          styles=values/'styles.xml'
          if styles.exists():
              s=styles.read_text(encoding='utf-8',errors='replace')
              repl={
                '<item name="android:scaleType">3</item>':'<item name="android:scaleType">fitCenter</item>',
                '<item name="android:ellipsize">3</item>':'<item name="android:ellipsize">end</item>',
                '<item name="android:layout_width">-1</item>':'<item name="android:layout_width">match_parent</item>',
                '<item name="android:layout_width">-2</item>':'<item name="android:layout_width">wrap_content</item>',
                '<item name="android:layout_height">-1</item>':'<item name="android:layout_height">match_parent</item>',
                '<item name="android:layout_height">-2</item>':'<item name="android:layout_height">wrap_content</item>',
                '<item name="android:windowSoftInputMode">0x10</item>':'<item name="android:windowSoftInputMode">adjustResize</item>',
                '<item name="android:windowSoftInputMode">0x20</item>':'<item name="android:windowSoftInputMode">adjustPan</item>',
                '<item name="android:windowSoftInputMode">0x11</item>':'<item name="android:windowSoftInputMode">stateUnspecified|adjustResize</item>'}
              for a,b in repl.items(): s=s.replace(a,b)
              styles.write_text(s,encoding='utf-8')
          for p in values.glob('*.xml'):
              s=p.read_text(encoding='utf-8',errors='replace').replace('@attr/??','@null')
              p.write_text(s,encoding='utf-8')
          PY

          python3 <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('build-src/smali').rglob('*.smali'):
              n=p.read_text(encoding='utf-8',errors='replace').count('.class ')
              if n!=1: bad.append((str(p),n))
          if bad:
              print(*bad[:20],sep='\n'); raise SystemExit(1)
          PY

          cat > build-src/apktool.yml <<'YAML'
          version: 3.0.3
          apkFileName: Kovick.apk
          isFrameworkApk: false
          usesFramework:
            ids:
              - 1
            tag: null
          sdkInfo:
            minSdkVersion: "27"
            targetSdkVersion: "35"
          packageInfo:
            forcedPackageId: 127
            renameManifestPackage: null
          versionInfo:
            versionCode: 406
            versionName: "2.3.21"
          resourcesInfo:
            packageId: 127
            packageName: com.zjx.ztezscreenshot
            sparseEntries: false
            compactEntries: false
            keepRawValues: false
          sharedLibrary: false
          sparseResources: false
          doNotCompress:
            - arsc
            - png
            - dex
          unknownFiles: {}
          YAML
      - name: Build unsigned APK
        run: |
          set -euo pipefail
          apktool b build-src -o "$RUNNER_TEMP/Kovick-unsigned.apk"
          test -s "$RUNNER_TEMP/Kovick-unsigned.apk"
      - name: Align and sign APK
        run: |
          set -euo pipefail
          B="$ANDROID_HOME/build-tools/36.0.0"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/kovick-debug.keystore" -storepass android -keypass android -alias kovick -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kovick, OU=Build, O=Kovick, L=Unknown, ST=Unknown, C=BR"
          "$B/zipalign" -f -p 4 "$RUNNER_TEMP/Kovick-unsigned.apk" "$RUNNER_TEMP/Kovick-aligned.apk"
          "$B/apksigner" sign --ks "$RUNNER_TEMP/kovick-debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/Kovick.apk" "$RUNNER_TEMP/Kovick-aligned.apk"
          "$B/apksigner" verify --verbose "$RUNNER_TEMP/Kovick.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kovick-APK
          path: ${{ runner.temp }}/Kovick.apk
          if-no-files-found: error
          retention-days: 14
          overwrite: true
